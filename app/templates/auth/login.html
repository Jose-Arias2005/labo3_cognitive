{% extends "base.html" %}
{% block content %}
<div class="auth-card">
    <h2 class="text-center">Iniciar Sesión</h2>
    <form method="POST" action="{{ url_for('auth_routes.login') }}" class="auth-form">
        <div class="form-group">
            <label for="identificador">Usuario o Email</label>
            <input type="text" id="identificador" name="identificador" class="form-control" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
    </form>
    <p class="text-center mt-2">¿No tienes cuenta? <a href="{{ url_for('auth_routes.register') }}">Regístrate aquí</a></p>
</div>
{% endblock %}
