{% extends "base.html" %}
{% block content %}
<div class="auth-card">
    <h2 class="text-center">Verificación en dos pasos</h2>
    <p class="text-center text-muted">Hemos enviado un código de 6 dígitos a <strong>{{ email }}</strong></p>
    
    <form method="POST" action="{{ url_for('auth_routes.verificar_2fa') }}" class="auth-form mt-2">
        <div class="form-group text-center">
            <label for="codigo">Código 2FA</label>
            <input type="text" id="codigo" name="codigo" class="form-control text-center code-input" maxlength="6" autocomplete="off" required autofocus>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Verificar</button>
    </form>
</div>
{% endblock %}
