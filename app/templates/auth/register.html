{% extends "base.html" %}
{% block content %}
<div class="auth-card">
    <h2 class="text-center">Crear Cuenta</h2>
    <form method="POST" action="{{ url_for('auth_routes.register') }}" class="auth-form mt-2">
        <div class="form-group">
            <label for="nombre">Nombre Completo</label>
            <input type="text" id="nombre" name="nombre" class="form-control" required autofocus>
        </div>
        <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" name="email" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="rol">Rol</label>
            <select id="rol" name="rol" class="form-control">
                <option value="usuario">Usuario</option>
                <option value="admin">Administrador</option>
            </select>
        </div>
        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirmar Contraseña</label>
            <input type="password" id="confirm_password" name="confirm_password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Registrarse</button>
    </form>
    <p class="text-center mt-2">¿Ya tienes cuenta? <a href="{{ url_for('auth_routes.login') }}">Inicia sesión</a></p>
</div>
{% endblock %}
