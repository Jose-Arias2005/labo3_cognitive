{% extends "base.html" %}
{% block content %}
<div class="form-container">
    <div class="page-header flex-between">
        <h2>{{ accion }} Usuario</h2>
        <a href="{{ url_for('usuario_routes.listar_usuarios') }}" class="btn btn-outline">Cancelar</a>
    </div>

    <form method="POST" class="crud-form mt-2">
        <div class="form-group">
            <label for="nombre">Nombre Completo</label>
            <input type="text" id="nombre" name="nombre" class="form-control" value="{{ usuario.nombre if usuario else '' }}" required>
        </div>

        <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" name="email" class="form-control" value="{{ usuario.email if usuario else '' }}" required>
        </div>

        <div class="form-group">
            <label for="rol">Rol</label>
            <select id="rol" name="rol" class="form-control">
                <option value="usuario" {% if usuario and usuario.rol == 'usuario' %}selected{% endif %}>Usuario</option>
                <option value="admin" {% if usuario and usuario.rol == 'admin' %}selected{% endif %}>Administrador</option>
            </select>
        </div>

        <div class="form-group">
            <label for="password">Contraseña {% if usuario %}<small class="text-muted">(Dejar en blanco para no cambiar)</small>{% endif %}</label>
            <input type="password" id="password" name="password" class="form-control" {% if not usuario %}required{% endif %}>
        </div>

        <div class="form-actions mt-2">
            <button type="submit" class="btn btn-primary">{{ accion }} Usuario</button>
        </div>
    </form>
</div>
{% endblock %}
